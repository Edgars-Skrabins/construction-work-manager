name: Set up app
description: Build the dev image and install Composer dependencies.

runs:
  using: composite
  steps:
    - name: Match container user to runner
      shell: bash
      run: |
        echo "USER_ID=$(id -u)" >> "$GITHUB_ENV"
        echo "GROUP_ID=$(id -g)" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build dev image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/Dockerfile
        target: dev
        load: true
        tags: construction-work-manager-app
        build-args: |
          USER_ID=${{ env.USER_ID }}
          GROUP_ID=${{ env.GROUP_ID }}
        cache-from: type=gha,scope=app
        cache-to: type=gha,scope=app,mode=max

    - name: Cache Composer downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: runtime/cache/composer
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install dependencies
      shell: bash
      run: docker compose run --rm --no-deps -T app composer install --no-interaction --no-progress
