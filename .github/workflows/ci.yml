name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Code style
        run: docker compose run --rm --no-deps -T app composer cs
      - name: Static analysis
        run: docker compose run --rm --no-deps -T app composer stan
      - name: Security audit
        run: docker compose run --rm --no-deps -T app composer audit

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: docker compose run --rm --no-deps -T app composer test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Start SQL Server
        run: docker compose up -d --wait sqlserver
      - name: Create database and logins
        run: docker compose run --rm -T db-init
      - name: Start app
        run: docker compose up -d --no-deps app
      - name: Security headers
        run: |
          status=0
          for path in /login /api/v1; do
            headers=$(curl -sS -D - -o /dev/null --retry 15 --retry-all-errors --retry-delay 1 "http://127.0.0.1:8080$path" | tr -d '\r')
            for expected in \
              "X-Content-Type-Options: nosniff" \
              "X-Frame-Options: DENY" \
              "Referrer-Policy: strict-origin-when-cross-origin" \
              "Content-Security-Policy: default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"; do
              if ! grep -Fqix "$expected" <<< "$headers"; then
                echo "::error::$path is missing '$expected'"
                status=1
              fi
            done
          done
          exit $status
      - name: Integration tests
        run: docker compose run --rm --no-deps -T app composer test:integration
      - name: SQL Server logs
        if: failure()
        run: docker compose logs sqlserver

  ci:
    name: ci
    if: always()
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
